version: 2.1

jobs:
  x_train:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Capture C
          command: |
            mkdir -p /tmp/work/D
            set +o pipefail 2>/dev/null; for i in $(seq 1 3000); do date -u +"%Y-%m-%dT%H:%M:%S.%6NZ"; done > /tmp/work/D/beta.server; true
            stat -c '%s %n' /tmp/work/D/beta.server
      - persist_to_workspace:
          root: /tmp/work/D
          paths:
            - 'beta.server'
  ed-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/work/D
      - run:
          name: Attach B
          command: |
            head -c 1024 /tmp/work/D/crc_19800fc29427dec 2>/dev/null | grep -c 'file' 2>/dev/null || true
      - run:
          name: Fetch artifact
          command: git clone --depth 5 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: zcat content-cooked.tgz | tar xf -
      - run:
          name: Finalize build
          command: sleep 30
      - run:
          name: Record build info
          command: uname -a
      - run:
          name: Post-build check
          command: df -h
      - run:
          command: /bin/bash -c "./sniff-collector"
